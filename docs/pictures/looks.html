<!doctype html>
<!--
Looks, on a small tablet: the Zep paper and its chat in Carrel's light theme, its dark theme with
Dark pages (the paper drawn light on dark), and E-ink.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>looks</title>
<link rel="stylesheet" href="style.css">
<style>
.main { justify-content: center; gap: 22px; }
  .col { gap: 0; }
</style>
</head>
<body>
<div class="frame">
  <div class="head">
    <span class="kicker">Make it yours</span>
    <h1>Light, dark, or e-ink</h1>
    <span class="sub">Each device keeps its own theme, text sizes, place for the chat, and model. On an e-ink tablet nothing moves: pages turn instead of scrolling.</span>
  </div>
  <div class="main">
    <div class="col"><div><div class="tablet"><img data-capture="looks-carrel-light" src="captures/looks-carrel-light.png" style="width: 260px; height: 372px" alt=""></div></div><div class="caption"><b>Carrel</b>, light</div></div>
    <div class="col"><div><div class="tablet"><img data-capture="looks-carrel-dark" src="captures/looks-carrel-dark.png" style="width: 260px; height: 372px" alt=""></div></div><div class="caption"><b>Carrel</b>, dark pages</div></div>
    <div class="col"><div><div class="eink"><img data-capture="looks-eink" src="captures/looks-eink.png" style="width: 260px; height: 372px" alt=""></div></div><div class="caption"><b>E-ink</b>: page turns, no motion</div></div>
  </div>
</div>
</body>
</html>
