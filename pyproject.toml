[project]
name = "carrel"
version = "0.1.0"
description = "Read a paper on a tablet with Claude Code beside it: the PDF above, the chat below, served from the laptop over Tailscale"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Pinned: Claude Code comes bundled with it, and an update is a deliberate bump
    # (ask the dozen questions again, run the engine's reading canary).
    "claude-agent-sdk==0.2.174",
    "contourpy>=1.2",
    "numpy>=2",         # meaning.py, imported from the engine: the papers' vectors
    "pyyaml>=6",        # paperlib.py, imported from the engine
    "scipy>=1.12",
    "send2trash>=2.1.0",  # BSD-3-Clause: a deleted overview note goes to the Trash
    "sentence-transformers>=6.2",  # Apache-2.0; meaning.py, imported from the engine: its encoder
    "starlette>=0.47",
    "umap-learn>=0.5.12",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
carrel = "carrel.cli:main"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3", "pytest-asyncio>=1.0", "ruff>=0.16.10"]
# For scripts/shots.py, which drives real browsers.
shots = ["playwright>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carrel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/carrel/static/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
