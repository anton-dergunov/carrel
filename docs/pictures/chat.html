<!doctype html>
<!--
The chat. Left: the top of the list of chats in the library, carrel's and those from VS Code or the
terminal, the latest first. Right, a small tablet with the chat on a tab of its own: "/" typed,
listing the library's skills and Claude Code's commands.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>chat</title>
<link rel="stylesheet" href="style.css">
<style>
  .main { justify-content: center; gap: 28px; }
</style>
</head>
<body>
<div class="frame">
  <div class="head">
    <span class="kicker">The chat</span>
    <h1>Claude Code, beside the paper</h1>
    <span class="sub">The chat is a Claude Code session on your laptop, in the library, so it carries on through a reload or a sleeping tablet. Go back to any chat in the library, from VS Code or the terminal too.</span>
  </div>
  <div class="main">
    <div class="col" style="width: 470px">
      <div class="card fade"><img src="captures/chat-earlier.png" style="width: 470px; height: 407px" alt=""></div>
    </div>
    <div class="tablet"><img data-capture="chat-commands" src="captures/chat-commands.png" style="width: 300px; height: 430px" alt=""></div>
  </div>
</div>
</body>
</html>
