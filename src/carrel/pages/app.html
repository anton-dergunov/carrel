<nav id="strip" class="bar">
  <div id="tabs" role="tablist">
    <button type="button" role="tab" class="tab icon-tab" id="tab-papers" aria-label="Library" title="Library"><svg class="icon"><use href="#i-library"/></svg></button>
    <span id="paper-tabs"></span>
    <button type="button" role="tab" class="tab icon-tab" id="tab-chat" aria-label="Chat" title="Chat" hidden><svg class="icon"><use href="#i-chat"/></svg></button>
  </div>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" class="icon-button" id="pen" aria-label="Highlight what I select" title="Highlight what I select" aria-pressed="false"><svg class="icon"><use href="#i-highlighter"/></svg></button>
  <button type="button" class="icon-button" id="find-button" aria-label="Find in this paper" title="Find in this paper"><svg class="icon"><use href="#i-search"/></svg></button>
  <button type="button" class="icon-button" id="view-button" aria-label="Layout" title="Layout" aria-expanded="false" aria-controls="view-sheet"><svg class="icon"><use href="#i-view"/></svg></button>
  <button type="button" class="icon-button" id="chat-toggle" aria-label="Show or hide the chat" title="Show or hide the chat" aria-pressed="true"><svg class="icon"><use href="#i-panel-bottom"/></svg></button>
  <form id="find" role="search" hidden>
    <input id="find-input" type="search" placeholder="Find in this paper" aria-label="Find in this paper" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
    <output id="find-count"></output>
    <button type="button" class="icon-button" id="find-previous" aria-label="Previous match" title="Previous match"><svg class="icon"><use href="#i-up"/></svg></button>
    <button type="button" class="icon-button" id="find-next" aria-label="Next match" title="Next match"><svg class="icon"><use href="#i-down"/></svg></button>
    <button type="button" class="plain" id="find-done">Done</button>
  </form>
</nav>
<section id="papers-pane" class="content" aria-label="The library">
  <header id="library-bar">
    <div class="library-top">
      <h1>$library</h1>
      <label class="search-box">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="filter" type="search" placeholder="Search titles, authors, summaries" aria-label="Search the library" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <div class="segmented" id="depth" role="radiogroup" aria-label="Search in">
        <button type="button" role="radio" data-depth="titles">Titles</button>
        <button type="button" role="radio" data-depth="text">Text</button>
        <button type="button" role="radio" data-depth="meaning">Meaning</button>
      </div>
    </div>
    <div class="library-controls">
      <div class="segmented" id="views" role="radiogroup" aria-label="View">
        <button type="button" role="radio" data-view="desk">Desk</button>
        <button type="button" role="radio" data-view="areas">Areas</button>
        <button type="button" role="radio" data-view="all">All</button>
        <button type="button" role="radio" data-view="timeline">Timeline</button>
      </div>
      <span id="library-count" aria-live="polite"></span>
      <button type="button" class="icon-button" id="library-add" aria-label="Add a paper" title="Add a paper" aria-expanded="false" aria-controls="add-sheet"><svg class="icon"><use href="#i-plus"/></svg></button>
      <button type="button" class="icon-button" id="library-options" aria-label="Sort and rows" title="Sort and rows" aria-expanded="false" aria-controls="options-sheet"><svg class="icon"><use href="#i-sliders-horizontal"/></svg></button>
    </div>
    <div id="chips" role="toolbar" aria-label="Filters" hidden></div>
  </header>
  <div id="desk-view" hidden></div>
  <div id="areas-view">
    <nav id="area-tree" aria-label="Areas"></nav>
    <div id="area-page"></div>
  </div>
  <div id="all-view" hidden></div>
  <div id="timeline-view" hidden></div>
</section>
<section id="review-pane" class="content" aria-label="Review"></section>
<section id="pdf-pane" class="content">
  <div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div>
  <button type="button" id="page-badge" aria-label="Contents and pages" aria-expanded="false" aria-controls="contents-sheet" hidden></button>
  <div id="contents-sheet" class="sheet" role="dialog" aria-label="The paper" hidden>
    <div class="sheet-bar">
      <form id="go-to-page">
        <label for="page-number">Page</label>
        <input id="page-number" type="number" inputmode="numeric" min="1" enterkeyhint="go">
        <span id="page-count"></span>
      </form>
      <button type="button" class="icon-button" id="sheet-size" aria-label="Open out" title="Open out"><svg class="icon"><use href="#i-maximize-2"/></svg></button>
      <button type="button" class="icon-button" id="sheet-close" aria-label="Close" title="Close" hidden><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-columns">
      <div id="paper-info" hidden></div>
      <div class="sheet-side">
        <div id="paper-similar" hidden></div>
        <nav id="outline" aria-label="Contents"></nav>
      </div>
      <div id="paper-actions" hidden></div>
    </div>
  </div>
  <div id="pdf-notice" role="status" hidden></div>
</section>
<div id="options-sheet" class="sheet" role="dialog" aria-label="Sort and rows" hidden></div>
<div id="chip-sheet" class="sheet" role="menu" hidden></div>
<div id="add-sheet" class="sheet" role="dialog" aria-label="Add a paper" hidden></div>
<div id="peek" class="sheet" role="dialog" aria-label="A cited paper" hidden></div>
<div id="mark-panel" class="sheet" role="dialog" aria-label="Highlight" hidden>
  <span id="mark-colors"></span>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" class="icon-button" id="mark-remove" aria-label="Remove the highlight" title="Remove the highlight"><svg class="icon"><use href="#i-trash"/></svg></button>
  <button type="button" class="plain" id="mark-ask">Ask</button>
</div>
<div id="divider" role="separator" aria-label="Drag to resize the chat"></div>
<section id="chat-pane">
  <div id="chat-body">
    <div id="log" aria-live="polite"></div>
    <div id="chats-sheet" hidden></div>
    <div id="overview-sheet" hidden></div>
  </div>
  <div id="chat-foot">
    <button type="button" class="plain" id="model" aria-label="Chat settings" title="Chat settings" aria-expanded="false" aria-controls="settings-dialog">Model</button>
    <div id="status" aria-live="polite"></div>
    <button type="button" class="icon-button" id="overview" aria-label="Write an overview" title="Write an overview" aria-expanded="false" aria-controls="overview-sheet" hidden><svg class="icon"><use href="#i-notebook-pen"/></svg></button>
    <button type="button" class="icon-button" id="chats" aria-label="Earlier chats" title="Earlier chats" aria-expanded="false"><svg class="icon"><use href="#i-history"/></svg></button>
    <button type="button" class="icon-button" id="new-chat" aria-label="New chat" title="New chat"><svg class="icon"><use href="#i-new-chat"/></svg></button>
  </div>
  <div id="commands" role="listbox" aria-label="Slash commands" hidden></div>
  <div id="quote" hidden>
    <button type="button" class="words" title="Go to it in the paper"></button>
    <span class="where"></span>
    <button type="button" class="icon-button drop" aria-label="Ask without this passage" title="Ask without this passage"><svg class="icon"><use href="#i-close"/></svg></button>
  </div>
  <form id="ask">
    <textarea id="question" rows="1" placeholder="Ask about this paper" enterkeyhint="send"></textarea>
    <button type="submit" id="send">Ask</button>
    <button type="button" id="stop" hidden>Stop</button>
  </form>
</section>
<div id="view-sheet" class="sheet" hidden>
  <div class="sheet-header">The chat, on this device</div>
  <div class="choices" role="radiogroup" aria-label="Where the chat sits">
    <button type="button" role="radio" data-place="bottom"><svg class="icon"><use href="#i-panel-bottom"/></svg>Below</button>
    <button type="button" role="radio" data-place="top"><svg class="icon"><use href="#i-panel-top"/></svg>Above</button>
    <button type="button" role="radio" data-place="left"><svg class="icon"><use href="#i-panel-left"/></svg>Left</button>
    <button type="button" role="radio" data-place="right"><svg class="icon"><use href="#i-panel-right"/></svg>Right</button>
    <button type="button" role="radio" data-place="tab"><svg class="icon"><use href="#i-chat"/></svg>A tab</button>
  </div>
  <button type="button" id="reset-size" class="plain">Default size</button>
</div>
<dialog id="settings-dialog" aria-label="Chat settings"></dialog>
</body>
</html>
