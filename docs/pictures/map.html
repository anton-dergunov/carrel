<!doctype html>
<!--
The meaning map, on the Mac app, the map alone. Left: the whole library a little nearer than whole,
its regions named by a model. Right: near the LLM-judge papers, lit by a meaning search, "how far
an LLM judge agrees with human raters", with one paper's peek open. The fact is the engine's
meaning-search experiment (agentic-paper-library, experiments/meaning-search).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>map</title>
<link rel="stylesheet" href="style.css">
<style>
.main { justify-content: center; }
</style>
</head>
<body>
<div class="frame">
  <div class="head">
    <span class="kicker">The map</span>
    <h1>Papers laid out by what they are about</h1>
    <span class="sub">Every paper placed by its meaning, its regions named. A search in your own words lights up the papers nearest it; Qwen3-Embedding-0.6B, the encoder an experiment on this library chose, embeds them.</span>
  </div>
  <div class="main">
    <div class="card"><img data-capture="map-whole" src="captures/map-whole.png" style="width: 444px; height: 393px" alt=""></div>
    <div class="card"><img data-capture="map-search" src="captures/map-search.png" style="width: 444px; height: 393px" alt=""></div>
  </div>
</div>
</body>
</html>
